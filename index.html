<body>

  <div id="onscreen-buttons">
    <button onclick="sendKey('ArrowLeft')">Left</button>
    <button onclick="sendKey('ArrowRight')">Right</button>
    <button onclick="sendKey('KeyX')">Jump</button>
    <button onclick="sendKey('KeyZ')">Run</button>
  </div>

  <script>
    function keyInfoFromCode(code) {
      switch (code) {
        case 'ArrowLeft': return { key: 'ArrowLeft', code, keyCode: 37 };
        case 'ArrowRight': return { key: 'ArrowRight', code, keyCode: 39 };
        case 'KeyX': return { key: 'x', code, keyCode: 88 };
        case 'KeyZ': return { key: 'z', code, keyCode: 90 };
        default: return null;
      }
    }

    function sendKey(code) {
      const keyInfo = keyInfoFromCode(code);
      if (!keyInfo) return;

      const down = new KeyboardEvent('keydown', keyInfo);
      window.dispatchEvent(down);

      setTimeout(() => {
        const up = new KeyboardEvent('keyup', keyInfo);
        window.dispatchEvent(up);
      }, 150);
    }

    document.querySelectorAll('#onscreen-buttons button').forEach(button => {
      button.addEventListener('touchstart', e => e.target.click());
    });
  </script>
