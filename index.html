<body>

  <div id="onscreen-buttons">
    <button onclick="sendKey('ArrowLeft')">Left</button>
    <button onclick="sendKey('ArrowRight')">Right</button>
    <button onclick="sendKey('KeyX')">Jump</button>
    <button onclick="sendKey('KeyZ')">Run</button>
  </div>

  
<script>
  function sendKey(code) {
    const map = {
      'ArrowLeft': 37,
      'ArrowRight': 39,
      'KeyX': 88,
      'KeyZ': 90
    };

    const keyCode = map[code];
    if (!keyCode) return;

    // Trigger keydown
    const down = new KeyboardEvent('keydown', {
      bubbles: true,
      cancelable: true,
      keyCode: keyCode,
      which: keyCode
    });
    Object.defineProperty(down, 'keyCode', { get: () => keyCode });
    Object.defineProperty(down, 'which', { get: () => keyCode });
    document.dispatchEvent(down);

    // Trigger keyup after short delay
    setTimeout(() => {
      const up = new KeyboardEvent('keyup', {
        bubbles: true,
        cancelable: true,
        keyCode: keyCode,
        which: keyCode
      });
      Object.defineProperty(up, 'keyCode', { get: () => keyCode });
      Object.defineProperty(up, 'which', { get: () => keyCode });
      document.dispatchEvent(up);
    }, 150);
  }

  // Mobile touch support
  document.querySelectorAll('#onscreen-buttons button').forEach(button => {
    button.addEventListener('touchstart', e => {
      e.preventDefault();
      button.click();
    });
  });
</script>
